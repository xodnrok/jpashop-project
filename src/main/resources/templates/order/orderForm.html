<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}" />
<body>
<div class="container">
  <div th:replace="~{fragments/bodyHeader :: bodyHeader}"/>

  <form role="form" action="/order" method="post" th:object="${orderForm}">

    <div class="form-group">
      <label for="item">상품명</label>
      <select name="itemId" id="item" class="form-control" onchange="updatePrice()">
        <option value="">상품선택</option>
        <option th:each="item : ${items}"
                th:value="${item.id}"
                th:text="${item.name}"
                th:data-price="${item.price}" />
      </select>
      <p th:if="${#fields.hasErrors('itemId')}"
         th:errors="*{itemId}">상품 선택 에러 메시지</p>
    </div>

    <div class="form-group">
      <label for="price">중고가격</label>
      <input type="text" id="price" class="form-control" placeholder="상품을 선택하면 가격이 표시됩니다" readonly>
    </div>

    <div class="form-group">
      <label for="count">주문수량</label>
      <input type="number" name="count" class="form-control" id="count"
             placeholder="주문 수량을 입력하세요">
      <p th:if="${#fields.hasErrors('count')}"
         th:errors="*{count}">상품 수량 에러 메시지</p>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
  <br/>
  <div th:replace="~{fragments/footer :: footer}" />
</div> <script>
  function updatePrice() {
      // 선택된 옵션 가져오기
      var selectBox = document.getElementById("item");
      var selectedOption = selectBox.options[selectBox.selectedIndex];

      // 숨겨둔 data-price 값 가져오기
      var price = selectedOption.getAttribute("data-price");

      // 가격 입력창에 값 넣기
      var priceField = document.getElementById("price");

      if (price) {
          // 가격이 있으면 넣기 (보기 좋게 '원' 붙여도 됨)
          priceField.value = price + "원";
      } else {
          // '상품선택' 같은거 고르면 비우기
          priceField.value = "";
      }
  }
</script>

</body>
</html>
